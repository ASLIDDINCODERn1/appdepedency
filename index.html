<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morphological POS tagging</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- SheetJS: client-side Excel export fallback -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<div class="bg-scene">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="orb orb-4"></div>
</div>

<div id="toastContainer"></div>

<div class="theme-switch-wrapper">
  <button class="theme-toggle-btn" id="themeToggle" title="Tungi/Kunduzgi rejim">
    <span class="toggle-icon icon-sun">☀️</span>
    <span class="toggle-icon icon-moon">🌙</span>
  </button>
</div>

<div class="container">

  <!-- HEADER -->
  <header class="header">
    <div class="logo"><i class="fas fa-language"></i></div>
    <h1>Morphological POS tagging</h1>
    <p>Rule-Based · Dataset DB · Statistik Model</p>
  </header>

  <!-- INPUT -->
  <div class="main-card glass">
    <label class="input-label">
      <i class="fas fa-paragraph"></i> Gap yoki matn kiriting:
    </label>
    <div class="textarea-wrap">
      <textarea id="textInput"
        placeholder="Masalan: Men bugun katta bog'da tez yurdim va beshta olma yedim..."
        rows="4"></textarea>
    </div>

    <!-- Example sentences -->
    <div class="examples">
      <span class="ex-label">Namuna:</span>
      <button class="ex-btn" data-txt="Men bugun katta bog'da beshta olma yedim.">1</button>
      <button class="ex-btn" data-txt="Hech kim hech nima demadi, hamma jim o'tirdi.">2</button>
      <button class="ex-btn" data-txt="U juda tez yugurdi va o'ttizta nafar kishini ortda qoldirdi.">3</button>
      <button class="ex-btn" data-txt="Bugun ertalab eng chiroyli qizil gullar sariq barglar orasida ko'rindi.">4</button>
    </div>

    <div class="input-actions">
      <button class="btn-primary" id="analyzeBtn">
        <i class="fas fa-search"></i>
        <span id="btnText">Tahlil qilish</span>
        <i class="fas fa-spinner fa-spin" id="btnSpinner" style="display:none"></i>
      </button>
      <button class="btn-outline" id="clearBtn">
        <i class="fas fa-trash-alt"></i> Tozalash
      </button>
      <button class="btn-outline-info" id="rulesBtn">
        <i class="fas fa-book"></i> Qoidalar
      </button>
    </div>
  </div>

  <!-- RESULTS -->
  <div id="resultsSection" style="display:none">

    <!-- Stats -->
    <div class="stats-row glass">
      <div class="stat-chips" id="statChips"></div>
      <div class="export-btns">
        <button class="btn-excel" id="exportBtn">
          <i class="fas fa-file-excel"></i> Excel (.xlsx)
        </button>
      </div>
    </div>

    <!-- Filter tabs -->
    <div class="filter-tabs glass">
      <button class="tab active" data-filter="all"><i class="fas fa-list"></i> Hammasi</button>
      <button class="tab" data-filter="P"><i class="fas fa-user"></i> P (Olmosh)</button>
      <button class="tab" data-filter="RR"><i class="fas fa-bolt"></i> RR (Ravish)</button>
      <button class="tab" data-filter="JJ"><i class="fas fa-palette"></i> JJ (Sifat)</button>
      <button class="tab" data-filter="NUM"><i class="fas fa-hashtag"></i> NUM (Son)</button>
      <button class="tab" data-filter="N"><i class="fas fa-font"></i> N (Ot)</button>
      <button class="tab" data-filter="V"><i class="fas fa-running"></i> V (Fe'l)</button>
      <button class="tab" data-filter="UNKNOWN"><i class="fas fa-question"></i> Tahminiy</button>
    </div>

    <!-- Table -->
    <div class="table-wrap glass">
      <table class="pos-table" id="posTable">
        <thead>
          <tr>
            <th>#</th>
            <th>Token</th>
            <th>O'zak / Lemma</th>
            <th>POS</th>
            <th>Turkum</th>
            <th>Tur / Daraja</th>
          </tr>
        </thead>
        <tbody id="posTableBody"></tbody>
      </table>
    </div>

    <!-- DB Detail panel (on row click) -->
    <div class="detail-panel glass" id="detailPanel" style="display:none">
      <div class="detail-head">
        <span id="detailTitle">Qo'shimcha ma'lumot</span>
        <button class="detail-close" id="detailClose"><i class="fas fa-times"></i></button>
      </div>
      <div id="detailBody" class="detail-body"></div>
    </div>

  </div>

  <!-- RULES MODAL -->
  <div class="modal-overlay" id="rulesModal" style="display:none">
    <div class="modal glass">
      <div class="modal-head">
        <h3><i class="fas fa-book"></i> Lingvistik Qoidalar (PDF asosida)</h3>
        <button class="modal-close" id="rulesClose"><i class="fas fa-times"></i></button>
      </div>
      <div class="modal-body" id="rulesBody">
        <p class="loading-msg"><i class="fas fa-spinner fa-spin"></i> Qoidalar yuklanmoqda...</p>
      </div>
    </div>
  </div>

</div><!-- /container -->

<script src="script.js"></script>
<script>
  // Theme toggle
  const html = document.documentElement;
  if (localStorage.getItem('theme') === 'dark') html.setAttribute('data-theme','dark');
  document.getElementById('themeToggle').addEventListener('click', () => {
    const dark = html.getAttribute('data-theme') === 'dark';
    html.setAttribute('data-theme', dark ? 'light' : 'dark');
    localStorage.setItem('theme', dark ? 'light' : 'dark');
  });
</script>
</body>
</html>
